<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Apple TV Metallic Platinum Gradient -->
    <linearGradient id="rg-apple-tv-metal" x1="0" y1="166" x2="0" y2="343" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="14%" stop-color="#F1F5F9"/>
      <stop offset="32%" stop-color="#E2E8F0"/>
      <stop offset="56%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Ableton Live Hardware Dual Shadow Filter (Top ambient shadow + Bottom shadow + Inner grooves) -->
    <filter id="rg-ableton-shadows" x="-20%" y="-20%" width="140%" height="140%">
      <!-- 1. Bottom drop shadow -->
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.95" result="drop"/>
      
      <!-- 2. Sombrita arriba: Top inner shadow (shadow cast down from the upper rim) -->
      <feOffset dx="0" dy="5" in="SourceAlpha" result="topOffset"/>
      <feGaussianBlur stdDeviation="3" in="topOffset" result="topBlur"/>
      <feComposite operator="out" in="SourceAlpha" in2="topBlur" result="topInsetMask"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.85" result="topShadowColor"/>
      <feComposite operator="in" in="topShadowColor" in2="topInsetMask" result="topInnerShadow"/>

      <!-- 3. Sombrita abajo: Bottom inner shadow (shadow cast up from the lower rim) -->
      <feOffset dx="0" dy="-5" in="SourceAlpha" result="botOffset"/>
      <feGaussianBlur stdDeviation="3" in="botOffset" result="botBlur"/>
      <feComposite operator="out" in="SourceAlpha" in2="botBlur" result="botInsetMask"/>
      <feFlood flood-color="#020617" flood-opacity="0.92" result="botShadowColor"/>
      <feComposite operator="in" in="botShadowColor" in2="botInsetMask" result="botInnerShadow"/>

      <!-- Composite all layers together: drop shadow + metallic face + top & bottom shadow grooves -->
      <feMerge>
        <feMergeNode in="drop"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="topInnerShadow"/>
        <feMergeNode in="botInnerShadow"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep pitch-black base matching OLED theme -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- RG with Apple TV metallic gradient and Ableton Live top & bottom shadows -->
  <text x="250" y="341" text-anchor="middle" fill="url(#rg-apple-tv-metal)" filter="url(#rg-ableton-shadows)" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="240" letter-spacing="-14">RG</text>
</svg>
